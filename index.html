<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>湖南宁乡→海南 7天自驾攻略</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<style>
  :root{
    --primary:#667eea; --primary2:#764ba2; --accent:#f2719c;
    --warn:#faad14; --ok:#52c41a; --danger:#ff4d4f;
    --bg:#f5f7fb; --card:#ffffff; --text:#2b2f38; --sub:#6b7280; --mute:#9aa3af;
    --line:#ecedf2; --radius:16px; --shadow:0 4px 20px rgba(40,44,80,.08);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:var(--bg);color:var(--text);line-height:1.65;-webkit-font-smoothing:antialiased}
  a{color:var(--primary);text-decoration:none}
  .wrap{max-width:980px;margin:0 auto;padding:0 16px 80px}
  /* HERO */
  .hero{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;
    padding:42px 20px 34px;border-radius:0 0 28px 28px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;
    background:radial-gradient(circle,rgba(255,255,255,.18),transparent 70%)}
  .hero h1{margin:0 0 6px;font-size:30px;letter-spacing:.5px}
  .hero .sub{opacity:.92;font-size:15px}
  .tags{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px}
  .tag{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);
    padding:4px 12px;border-radius:999px;font-size:13px}
  .meta-row{margin-top:14px;display:flex;flex-wrap:wrap;gap:18px;font-size:13px;opacity:.95}
  .meta-row b{font-weight:600}
  /* TOP NAV */
  .topnav{position:sticky;top:0;z-index:500;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;padding:8px 12px}
  .topnav button{border:0;background:transparent;color:var(--sub);font-size:13.5px;padding:7px 12px;
    border-radius:10px;cursor:pointer;white-space:nowrap;font-family:inherit}
  .topnav button:hover{background:#eef0f7;color:var(--text)}
  .topnav button.active{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff}
  /* LAYOUT */
  .layout{display:grid;grid-template-columns:1fr 168px;gap:22px;margin-top:22px}
  @media(max-width:900px){.layout{grid-template-columns:1fr}.sidenav{display:none}}
  .sidenav{position:sticky;top:64px;align-self:start;display:flex;flex-direction:column;gap:6px}
  .sidenav a{font-size:13px;color:var(--sub);padding:6px 10px;border-radius:9px;border-left:3px solid transparent}
  .sidenav a:hover{background:#eef0f7;color:var(--text)}
  .sidenav a.active{border-left-color:var(--accent);color:var(--text);background:#f3f0fb;font-weight:600}
  .sidenav .daylink{padding-left:20px}
  /* SECTIONS */
  section{scroll-margin-top:60px;margin-bottom:26px}
  h2.sec{font-size:20px;margin:0 0 14px;display:flex;align-items:center;gap:9px}
  h2.sec .ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;font-size:16px}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
  /* MAP */
  #map{height:380px;border-radius:var(--radius);box-shadow:var(--shadow);z-index:1}
  #mapDetail{height:480px;border-radius:var(--radius);box-shadow:var(--shadow);z-index:1}
  .leg{height:22px;padding:0 8px;background:#fff;border:1px solid #e2e5ea;border-radius:11px;
       box-shadow:0 1px 5px rgba(0,0,0,.2);font-size:11px;font-weight:700;color:#2b2f38;
       display:grid;place-items:center;white-space:nowrap}
  .map-note{font-size:12px;color:var(--mute);margin-top:8px}
  /* OVERVIEW */
  .ov{display:flex;flex-wrap:wrap;gap:10px}
  .ov .chip{background:#eef1fb;border:1px solid #e2e6f7;color:#4b51a3;padding:8px 13px;border-radius:12px;font-size:13.5px}
  /* DAY CARD */
  .day{border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:18px;overflow:hidden;background:var(--card)}
  .day-hd{display:flex;align-items:center;gap:12px;padding:15px 18px;cursor:pointer;user-select:none}
  .day-badge{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;flex:none}
  .day-hd .t{flex:1}
  .day-hd .t .d{font-size:16.5px;font-weight:700}
  .day-hd .t .s{font-size:12.5px;color:var(--sub)}
  .day-hd .ar{transition:transform .25s;color:var(--mute)}
  .day.collapsed .ar{transform:rotate(-90deg)}
  .day-body{padding:0 18px 18px;display:block}
  .day.collapsed .day-body{display:none}
  .stop{display:flex;gap:14px;padding:12px 0;border-top:1px dashed var(--line);position:relative}
  .stop:first-child{border-top:0}
  .stop .tm{width:84px;flex:none;text-align:right;font-size:13px;color:var(--sub);padding-top:2px}
  .stop .tm .du{display:block;color:var(--mute);font-size:11px;margin-top:2px}
  .stop .dot{position:relative;flex:none;width:16px;display:flex;justify-content:center}
  .stop .dot:before{content:"";width:12px;height:12px;border-radius:50%;background:var(--primary);margin-top:5px;border:3px solid #fff;box-shadow:0 0 0 2px var(--primary)}
  .stop .dot:after{content:"";position:absolute;top:18px;bottom:-12px;width:2px;background:var(--line)}
  .stop:last-child .dot:after{display:none}
  .stop .body{flex:1;min-width:0}
  .stop .nm{font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .stop .cost{font-size:12px;color:#b06a00;background:#fff5e0;border:1px solid #ffe2a8;padding:1px 8px;border-radius:8px}
  .stop .desc{font-size:13.5px;color:#444;margin-top:3px}
  .stop .tip{font-size:12.5px;color:#0a7d54;background:#eafaf1;border-left:3px solid var(--ok);padding:5px 9px;border-radius:0 8px 8px 0;margin-top:6px}
  .stop .tn{font-size:12px;color:var(--primary);background:#eef1fb;padding:4px 9px;border-radius:8px;margin-top:7px;display:inline-block}
  .stop label.cb{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);margin-top:7px;cursor:pointer}
  .route-line{font-size:12px;color:var(--sub);background:#f4f6fc;border-radius:8px;padding:6px 10px;margin:10px 0 0;display:flex;align-items:center;gap:7px}
  .day-foot{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
  .day-foot .blk{font-size:13px;flex:1;min-width:200px}
  .day-foot .blk b{color:var(--text)}
  .day-foot .blk .lbl{color:var(--sub);font-size:12px;display:block;margin-bottom:3px}
  /* FOOD GRID */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
  .food{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:14px;border-top:3px solid var(--accent)}
  .food .nm{font-weight:700;font-size:15px}
  .food .pr{color:#b06a00;font-size:13px;margin:3px 0}
  .food .rc{font-size:12.5px;color:#555}
  .food .sr{font-size:11px;color:var(--mute);margin-top:5px}
  /* HOTELS */
  .hotel{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
  .hotel .a{font-weight:700;font-size:15px}
  .hotel .p{color:#b06a00;font-size:13px;margin:2px 0}
  .hotel .w{font-size:12.5px;color:#555}
  /* PITFALLS */
  .pit{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px dashed var(--line);font-size:13.5px}
  .pit:first-child{border-top:0}
  .pit .x{color:var(--danger);text-decoration:line-through;flex:1}
  .pit .ok{color:var(--ok);font-weight:600;flex:1}
  .pit .vs{color:var(--mute);padding:0 4px}
  /* BUDGET */
  table.bd{width:100%;border-collapse:collapse;font-size:13.5px}
  table.bd th,table.bd td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line)}
  table.bd th{color:var(--sub);font-weight:600;font-size:12.5px}
  table.bd td input{width:88px;border:1px solid var(--line);border-radius:8px;padding:5px 7px;font-size:13px;font-family:inherit}
  table.bd tr.total td{font-weight:700;font-size:15px;border-top:2px solid var(--primary)}
  .bd-actions{margin-top:10px;display:flex;gap:10px;flex-wrap:wrap}
  /* TIPS */
  .tips li{margin-bottom:7px;font-size:13.5px}
  /* TOOLBAR */
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 4px}
  .btn{border:0;border-radius:11px;padding:9px 16px;font-size:13.5px;cursor:pointer;font-family:inherit;
    background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;box-shadow:var(--shadow)}
  .btn.ghost{background:#fff;color:var(--primary);border:1px solid #d7dbef}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#2b2f38;color:#fff;
    padding:10px 18px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:999}
  .toast.show{opacity:1}
  footer{text-align:center;color:var(--mute);font-size:12px;margin-top:30px}
  .leaflet-popup-content{font-size:13px}
  .mk{width:24px;height:24px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:grid;place-items:center;
    color:#fff;font-weight:700;font-size:12px;box-shadow:0 2px 6px rgba(0,0,0,.3);border:2px solid #fff}
  .mk span{transform:rotate(45deg)}
  .src-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:4px}
  .src-dim{font-weight:700;margin:12px 0 2px;color:var(--primary);font-size:14px}
  .src{background:#f7f8fc;border:1px solid #eef0f7;border-radius:10px;padding:9px 11px;font-size:13px;line-height:1.5}
  .src a{color:var(--primary);word-break:break-all}
  .src .ch{color:var(--mute);font-size:12px;margin:2px 0}
  .src .st{display:inline-block;font-size:11px;padding:1px 7px;border-radius:20px;margin-left:6px;font-weight:600}
  .st-confirmed{background:#e6f7ec;color:#1a7f43}
  .st-est{background:#fff3e0;color:#b26a00}
  .st-unknown{background:#fdecec;color:#c0392b}
  .unc{background:#fff4f4;border:1px solid #f6d6d6;border-radius:10px;padding:10px 12px;margin-top:12px}
  .unc li{margin-bottom:6px;color:#a23}
  /* ---- RESEARCH PACKET 证据包 ---- */
  .rp{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
  .rp-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px}
  .rp-claim{font-weight:700;color:var(--ink);font-size:15px}
  .badge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:20px;font-weight:600;white-space:nowrap}
  .cf-high{background:#e6f7ec;color:#1a7f43}
  .cf-mid{background:#fff3e0;color:#b26a00}
  .cf-low{background:#fdecec;color:#c0392b}
  .tp-user{background:#eaf0ff;color:#2f5d9e}
  .tp-official-realtime{background:#e6f7ec;color:#1a7f43}
  .tp-official-web{background:#eef6ff;color:#2f6db0}
  .tp-public{background:#f2eef7;color:#6b4ba0}
  .tp-agent-inferred{background:#f3eef0;color:#8a5a6b}
  .rp-meta{font-size:13px;color:var(--mute);line-height:1.7}
  .rp-meta b{color:var(--ink2)}
  .rp-row{display:flex;gap:14px;flex-wrap:wrap;margin-top:5px}
  .rp-row span{font-size:12px;color:var(--ink2)}
  .rp-row b{color:var(--ink)}
  .rp a{color:#2f6db0;word-break:break-all}
  .rp-corrob{background:#f7f5f0;border-left:3px solid var(--accent);padding:5px 9px;font-size:12px;color:var(--ink2);margin-top:6px;border-radius:0 6px 6px 0}
  /* ---- 摄影机位 ---- */
  .photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  .photo-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .photo-card h4{font-size:15px;margin-bottom:4px;display:flex;align-items:center;gap:6px}
  .photo-card .ph-meta{font-size:12px;color:var(--mute);margin-top:6px}
  .photo-card .ph-tip{font-size:13px;color:var(--ink2);margin-top:7px;line-height:1.6}
</style>
</head>
<body>
<div class="hero">
  <div class="wrap" style="padding-bottom:0">
    <h1 id="hTitle"></h1>
    <div class="sub" id="hSub"></div>
    <div class="tags" id="hTags"></div>
    <div class="meta-row" id="hMeta"></div>
  </div>
</div>

<div class="topnav" id="topnav"></div>

<div class="wrap">
  <div class="toolbar">
    <button class="btn" onclick="window.print()">🖨️ 导出 PDF</button>
    <button class="btn ghost" onclick="copyMarkdown()">📋 复制 Markdown</button>
    <button class="btn ghost" onclick="resetLocal()">♻️ 清空我的勾选/改动</button>
  </div>

  <div class="layout">
    <div class="main">
      <section id="sec-map">
        <h2 class="sec"><span class="ico">🗺️</span>行程地图</h2>
        <div id="map"></div>
        <div class="map-note" id="mapNote"></div>
      </section>

      <section id="sec-map2" style="display:none">
        <h2 class="sec"><span class="ico">🏝️</span><span id="map2Title">目的地放大图</span></h2>
        <div id="mapDetail"></div>
        <div class="map-note" id="mapNote2"></div>
      </section>

      <section id="sec-overview">
        <h2 class="sec"><span class="ico">📌</span>行程总览</h2>
        <div class="card"><div class="ov" id="overview"></div></div>
      </section>

      <section id="sec-days">
        <h2 class="sec"><span class="ico">📅</span>每日行程</h2>
        <div id="days"></div>
      </section>

      <section id="sec-food">
        <h2 class="sec"><span class="ico">🍜</span>美食推荐</h2>
        <div class="grid" id="foods"></div>
      </section>

      <section id="sec-hotel">
        <h2 class="sec"><span class="ico">🏨</span>住宿推荐</h2>
        <div id="hotels"></div>
      </section>

      <section id="sec-pit">
        <h2 class="sec"><span class="ico">⚠️</span>避坑指南</h2>
        <div class="card" id="pits"></div>
      </section>

      <section id="sec-budget">
        <h2 class="sec"><span class="ico">💰</span>预算估算</h2>
        <div class="card">
          <table class="bd" id="budget"></table>
          <div class="bd-actions">
            <button class="btn ghost" onclick="saveBudget()">💾 保存我的预算</button>
            <span style="font-size:12px;color:var(--mute);align-self:center">可直接修改「舒适型」数字，合计自动重算</span>
          </div>
        </div>
      </section>

      <section id="sec-tips">
        <h2 class="sec"><span class="ico">💡</span>实用 Tips</h2>
        <div class="card"><ul class="tips" id="tips"></ul></div>
      </section>

      <section id="sec-photo">
        <h2 class="sec"><span class="ico">📸</span>摄影机位 / 出片点</h2>
        <div class="card"><div class="photo-grid" id="photoGrid"></div></div>
      </section>

      <section id="sec-sources">
        <h2 class="sec"><span class="ico">🔎</span>信息来源 / 存疑（多维度取证）</h2>
        <div class="card" id="srcWrap"></div>
      </section>
    </div>

    <aside class="sidenav" id="sidenav"></aside>
  </div>

  <footer id="foot"></footer>
</div>

<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"

<script>

const $=(s,r=document)=>r.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800);}

function renderBudget(rows){
  const tbl=$('#budget');
  tbl.innerHTML='<tr><th>项目</th><th>经济型</th><th>舒适型(可改)</th></tr>';
  rows.forEach((r,i)=>{
    const tr=el('tr');
    tr.innerHTML=`<td>${r.cat||''}</td><td>${r.eco||''}</td>`+
      `<td><input data-i="${i}" value="${r.comfort||''}"></td>`;
    tbl.appendChild(tr);
    tr.querySelector('input').addEventListener('input',()=>{computeBudget(rows);});
  });
  const tr=el('tr','total');tr.innerHTML='<td>合计/人</td><td id="ecoTot"></td><td id="comTot"></td>';
  tbl.appendChild(tr);
  computeBudget(rows);
}
function computeBudget(rows){
  let e=0,c=0;
  const inputs=$('#budget').querySelectorAll('input[data-i]');
  inputs.forEach(inp=>{const i=+inp.dataset.i;const cv=parseFloat(String(inp.value).replace(/[^\d.]/g,''))||0;c+=cv;
    const ev=parseFloat(String((rows[i]&&rows[i].eco||'').replace(/[^\d.]/g,''))||0);e+=ev;});
  $('#ecoTot').textContent='¥'+e.toLocaleString('zh-CN');
  $('#comTot').textContent='¥'+c.toLocaleString('zh-CN');
}

function renderSources(g){
  const sw=$('#srcWrap'); if(!sw)return;
  const items=g.research||g.sources||[];
  const cfMap={high:['cf-high','高置信'],mid:['cf-mid','中置信'],low:['cf-low','低置信'],
    confirmed:['cf-high','已核'],estimated:['cf-mid','估算'],unknown:['cf-low','待核']};
  const tpMap={user:['tp-user','用户确认'],'official-realtime':['tp-official-realtime','官方实时'],
    'official-web':['tp-official-web','官方网页'],public:['tp-public','公开资料'],'agent-inferred':['tp-agent-inferred','Agent推断']};
  if(items.length){
    const byDim={};
    items.forEach(s=>{const k=s.dimension||'其他'; (byDim[k]=byDim[k]||[]).push(s);});
    Object.keys(byDim).forEach(dim=>{
      sw.appendChild(el('div','src-dim',dim));
      byDim[dim].forEach(s=>{
        const cf=cfMap[s.confidence]||cfMap[s.status]||cfMap.mid;
        const tp=tpMap[s.sourceType]||null;
        const head=el('div','rp-head');
        head.appendChild(el('span','rp-claim',s.claim||s.note||'(无主张)'));
        head.appendChild(el('span','badge '+cf[0],cf[1]));
        if(tp)head.appendChild(el('span','badge '+tp[0],tp[1]));
        const card=el('div','rp'); card.appendChild(head);
        let meta='';
        const srcName=s.sourceName||s.channel||'';
        if(srcName)meta+='<b>来源</b>：'+esc(srcName)+'　';
        if(s.assertType)meta+='<b>主张</b>：'+esc(s.assertType)+'　';
        if(s.checkedAt)meta+='<b>核验</b>：'+esc(s.checkedAt)+'　';
        if(s.url)meta+='<a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.url)+'</a>';
        if(meta)card.appendChild(el('div','rp-meta',meta));
        const row=el('div','rp-row');
        if(s.impact)row.appendChild(el('span',null,'<b>影响</b>：'+esc(s.impact)));
        if(s.routeImpact)row.appendChild(el('span',null,'<b>路线</b>：'+esc(s.routeImpact)));
        if(s.note&&s.claim)row.appendChild(el('span',null,'<b>说明</b>：'+esc(s.note)));
        if(row.childNodes.length)card.appendChild(row);
        if(s.corroboration)card.appendChild(el('div','rp-corrob','独立佐证：'+esc(s.corroboration)));
        sw.appendChild(card);
      });
    });
  }
  if(g.uncertain&&g.uncertain.length){
    const u=el('div','unc');
    u.appendChild(el('div','src-dim','待核实 / 存疑'));
    const ul=el('ul','tips');
    g.uncertain.forEach(x=>ul.appendChild(el('li',null,'⚠️ '+x)));
    u.appendChild(ul); sw.appendChild(u);
  }
  if(!items.length&&(!g.uncertain||!g.uncertain.length)){
    sw.appendChild(el('div','desc','本次未单独登记来源维度；关键票价/坐标已在各模块注明核实状态。'));
  }
}

/* ---------- 地图 ---------- */
const ll=c=>[c[1],c[0]]; // 数据 coord=[经度,纬度](GCJ-02) -> Leaflet 需要的 [纬度,经度]
function stopsWithCoord(g){const out=[];(g.days||[]).forEach(d=>(d.stops||[]).forEach(s=>{if(s.coord)out.push({d:d,s:s});}));return out;}
function detailPoints(g){
  const bb=g.mapConfig&&g.mapConfig.detailBbox;
  if(!bb||bb.length<4)return[];
  const loLng=Math.min(bb[0],bb[2]),hiLng=Math.max(bb[0],bb[2]);
  const loLat=Math.min(bb[1],bb[3]),hiLat=Math.max(bb[1],bb[3]);
  return stopsWithCoord(g).filter(it=>{const c=it.s.coord;
    return c[0]>=loLng&&c[0]<=hiLng&&c[1]>=loLat&&c[1]<=hiLat;});
}
const LEG_COLOR={highway:'#e03131',scenic:'#2f9e44',ferry:'#1c7ed6',city:'#868e96'};
function fmtDur(m){m=Math.round(m);const h=Math.floor(m/60),r=m%60;return r?(h+'h'+r+'min'):(h+'h');}
function lgPts(lg){
  if(!lg.path)return[];
  const arr=(typeof lg.path==='string')?lg.path.split(';').map(s=>s.split(',').map(Number)):lg.path;
  return arr.map(ll);
}
function drawLegs(_map,legs){
  legs.forEach(lg=>{
    const pts=lgPts(lg); if(pts.length<2)return;
    const ferry=lg.mode==='ferry';
    L.polyline(pts,{color:LEG_COLOR[lg.mode]||'#667eea',weight:ferry?3:5,opacity:.85,dashArray:ferry?'12,10':null}).addTo(_map);
    const txt=lg.label||((lg.distance?Math.round(lg.distance)+'km · ':'')+(lg.duration?fmtDur(lg.duration):''));
    if(!txt)return;
    const mid=pts[Math.floor(pts.length/2)];
    const ic=L.divIcon({className:'',html:`<div class="leg"><span>${esc(txt)}</span></div>`,iconSize:[108,22],iconAnchor:[54,11]});
    L.marker(mid,{icon:ic}).addTo(_map).bindPopup(`<b>${esc(lg.from)} → ${esc(lg.to)}</b><br>${esc(txt)}${lg.note?'<br>'+esc(lg.note):''}`);
  });
}
function routeMapPoints(g){
  const names=(g.mapConfig&&g.mapConfig.routeMarkers)||null;
  const all=stopsWithCoord(g);
  if(!names||!names.length)return all;
  const f=all.filter(it=>names.indexOf(it.s.name)>=0);
  return f.length?f:all;
}
function drawRouteMap(elId,items,scope){
  const _map=L.map(elId,{zoomControl:true});
  L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',
    {subdomains:'1234',maxZoom:18,attribution:'© 高德地图'}).addTo(_map);
  const legs=(GUIDE.legs||[]).filter(x=>(x.map||'route')===(scope||'route'));
  let fit=items.map(it=>ll(it.s.coord));
  if(legs.length){
    drawLegs(_map,legs);
    legs.forEach(lg=>{fit=fit.concat(lgPts(lg));});
  }else{
    for(let i=1;i<items.length;i++){
      const a=items[i-1],b=items[i];
      const sameDay=a.d.day===b.d.day;
      const ferry=/轮渡|过海/.test((a.s.name||'')+(b.s.name||''));
      L.polyline([ll(a.s.coord),ll(b.s.coord)],{
        color:(sameDay?a.d.color:b.d.color)||'#667eea',
        weight:ferry?4:(sameDay?4:3),
        opacity:ferry?.9:.7,
        dashArray:ferry?'12,10':(sameDay?'1,8':'8,10')
      }).addTo(_map);
    }
  }
  items.forEach(it=>{
    const d=it.d,s=it.s;
    const num=(d.stops||[]).filter(x=>x.coord).indexOf(s)+1;
    const icon=L.divIcon({className:'',html:`<div class="mk" style="background:${d.color||'#667eea'}"><span>${num}</span></div>`,iconSize:[24,24],iconAnchor:[12,24]});
    const mk=L.marker(ll(s.coord),{icon}).addTo(_map).bindPopup(`<b>Day${d.day} ${s.name}</b><br>${s.time||''} · ${s.cost||''}`);
    mk.on('click',()=>{const c=document.querySelector(`.day[data-day="${d.day}"]`);if(c){c.classList.remove('collapsed');c.scrollIntoView({behavior:'smooth',block:'center'});}});
  });
  if(fit.length>1)_map.fitBounds(L.latLngBounds(fit).pad(0.12));
  else if(fit.length===1)_map.setView(fit[0],13);
}
function loadMap(){
  if(typeof L==='undefined'){$('#map').innerHTML='<div style="padding:30px;text-align:center;color:#999">地图组件加载失败（可能离线），不影响下方文字攻略。</div>';return;}
  const g=GUIDE;
  const all=stopsWithCoord(g);
  if(!all.length){$('#map').innerHTML='<div style="padding:30px;text-align:center;color:#999">暂无坐标数据，无法绘制地图。</div>';return;}
  drawRouteMap('map',routeMapPoints(g),'route');
  const det=detailPoints(g);
  if(det.length)drawRouteMap('mapDetail',det,'detail');
}

/* ---------- 导航 ---------- */
function buildNav(){
  const secs=[['sec-map','地图'],['sec-overview','总览'],['sec-days','每日行程'],['sec-food','美食'],
    ['sec-hotel','住宿'],['sec-pit','避坑'],['sec-budget','预算'],['sec-tips','Tips'],['sec-photo','摄影'],['sec-sources','来源/存疑']];
  const tn=$('#topnav'), sn=$('#sidenav');
  secs.forEach(([id,name])=>{
    const sec=document.getElementById(id);
    if(sec&&sec.style.display==='none')return;
    const b=el('button',null,name);b.onclick=()=>sec.scrollIntoView({behavior:'smooth'});tn.appendChild(b);
    const a=el('a',null,name);a.href='#'+id;a.textContent=name;sn.appendChild(a);
  });
  (GUIDE.days||[]).forEach(d=>{const a=el('a','daylink',`Day ${d.day} ${d.title||''}`);a.href='#sec-days';
    a.dataset.day=d.day;sn.appendChild(a);});
  const obs=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){
    const id=e.target.id;[...tn.children].forEach(b=>b.classList.toggle('active',b.textContent===secName(id)));
    [...sn.children].forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#'+id));
  }});});
  document.querySelectorAll('section').forEach(s=>obs.observe(s));
}
function secName(id){const m={'sec-map':'地图','sec-overview':'总览','sec-days':'每日行程','sec-food':'美食',
  'sec-hotel':'住宿','sec-pit':'避坑','sec-budget':'预算','sec-tips':'Tips','sec-photo':'摄影','sec-sources':'来源/存疑'};return m[id]||'';}

const LS_KEY='tg_'+ (GUIDE.meta&&GUIDE.meta.title||'guide');
function markVisited(id,on){const d=JSON.parse(localStorage.getItem(LS_KEY)||'{}');d.visited=d.visited||{};d.visited[id]=on;localStorage.setItem(LS_KEY,JSON.stringify(d));}
function saveBudget(){const d=JSON.parse(localStorage.getItem(LS_KEY)||'{}');
  const vals={};document.querySelectorAll('#budget input[data-i]').forEach(i=>vals[i.dataset.i]=i.value);
  d.budget=vals;localStorage.setItem(LS_KEY,JSON.stringify(d));toast('预算已保存到本机');}
function restoreLocal(){const d=JSON.parse(localStorage.getItem(LS_KEY)||'{}');
  if(d.visited)Object.keys(d.visited).forEach(id=>{const c=document.getElementById(id);if(c)c.checked=d.visited[id];});
  if(d.budget)document.querySelectorAll('#budget input[data-i]').forEach(i=>{if(d.budget[i.dataset.i]!=null)i.value=d.budget[i.dataset.i];computeBudget(GUIDE.budget||[]);});}
function resetLocal(){localStorage.removeItem(LS_KEY);location.reload();}

/* ---------- 导出 Markdown ---------- */
function copyMarkdown(){
  const g=GUIDE,m=g.meta||{};let md=`# ${m.title||'旅游攻略'}\n\n${m.subtitle||''}\n`;
  md+=`- 城市：${m.city||'-'} ｜ 天数：${m.days||'-'} ｜ 主题：${m.theme||'-'}\n\n`;
  md+='## 行程总览\n'+(g.overview||[]).map(o=>'- '+o).join('\n')+'\n\n';
  (g.days||[]).forEach(d=>{md+=`## Day ${d.day} · ${d.title||''}\n${d.summary||''}\n`;
    (d.stops||[]).forEach(s=>{md+=`- **${s.name}** ${s.time||''} ${s.cost?('('+s.cost+')'):''}：${s.desc||''}\n`;
      if(s.tip)md+=`  - 💡 ${s.tip}\n`;});
    if(d.food)md+='- 🍽️ '+(d.food.join('；'))+'\n';
    if(d.stay)md+='- 🏨 '+d.stay+'\n';});
  md+='\n## 美食推荐\n'+(g.foods||[]).map(f=>`- **${f.name}** ${f.price||''}：${f.rec||''}`).join('\n')+'\n';
  md+='\n## 避坑\n'+(g.pitfalls||[]).map(p=>`- ✗ ${p.wrong} → ✓ ${p.right}`).join('\n')+'\n';
  if(g.photoSpots&&g.photoSpots.length)md+='\n## 摄影机位\n'+g.photoSpots.map(p=>`- **${p.name||''}**${p.bestTime?('（'+p.bestTime+'）'):''}：${p.tip||''}`).join('\n')+'\n';
  const items=g.research||g.sources||[];
  if(items.length){const byDim={};items.forEach(s=>{const k=s.dimension||'其他';(byDim[k]=byDim[k]||[]).push(s);});
    md+='\n## 信息来源（多维度取证）\n';Object.keys(byDim).forEach(d=>{md+=`### ${d}\n`+byDim[d].map(s=>`- ${(s.claim||s.note||'')}${s.sourceName?(' ｜ '+s.sourceName):''}${s.url?(' '+s.url):''} ［${(s.confidence||s.status||'')}］`).join('\n')+'\n';});}
  if(g.uncertain&&g.uncertain.length)md+='\n## 待核实\n'+g.uncertain.map(x=>'- ⚠️ '+x).join('\n')+'\n';
  navigator.clipboard.writeText(md).then(()=>toast('Markdown 已复制')).catch(()=>toast('复制失败，请手动选择'));
}

render();
</script>
